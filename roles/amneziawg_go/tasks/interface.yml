---
- name: Рендер конфигурации интерфейса wg0 (для awg setconf)
  ansible.builtin.template:
    src: wg0-server.conf.j2
    dest: /opt/amneziawg-tools/keys/wg0.conf
    owner: root
    mode: '0600'
  notify: Apply amneziawg config

- name: Применение конфигурации, адреса и link up для wg0
  ansible.builtin.systemd:
    name: amneziawg-go-iface
    state: started

- name: Рендер клиентских конфигов по кодовым именам (хранятся только на VPS)
  ansible.builtin.template:
    src: client.conf.j2
    dest: "/opt/amneziawg-tools/keys/{{ item.name }}.conf"
    owner: root
    mode: '0600'
  loop: "{{ awg_clients }}"
  loop_control:
    label: "{{ item.name }}"

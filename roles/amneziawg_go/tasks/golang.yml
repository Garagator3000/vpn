---
- name: Проверка установленной версии Go
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_installed_version
  changed_when: false
  failed_when: false

- name: Установка Go {{ go_version }}
  when: go_installed_version.rc != 0 or go_version not in go_installed_version.stdout
  block:
    - name: Скачивание архива Go {{ go_version }}
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
        checksum: "sha256:{{ go_checksum }}"
        mode: '0644'

    - name: Удаление предыдущей установки Go
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    - name: Распаковка Go в /usr/local
      ansible.builtin.unarchive:
        src: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
        dest: /usr/local
        remote_src: true

- name: Symlink go/gofmt в /usr/local/bin
  ansible.builtin.file:
    src: "/usr/local/go/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop:
    - go
    - gofmt

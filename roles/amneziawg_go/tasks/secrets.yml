---
- name: Директория для ключей и параметров amneziawg
  ansible.builtin.file:
    path: /opt/amneziawg-tools/keys
    state: directory
    owner: root
    mode: '0700'

- name: Генерация приватного ключа сервера (если ещё нет)
  ansible.builtin.shell: umask 077 && awg genkey > /opt/amneziawg-tools/keys/server.key
  args:
    creates: /opt/amneziawg-tools/keys/server.key

- name: Публичный ключ сервера
  ansible.builtin.shell: awg pubkey < /opt/amneziawg-tools/keys/server.key > /opt/amneziawg-tools/keys/server.pub
  args:
    creates: /opt/amneziawg-tools/keys/server.pub

- name: Права на ключи сервера
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0600'
    owner: root
  loop:
    - /opt/amneziawg-tools/keys/server.key
    - /opt/amneziawg-tools/keys/server.pub

- name: Чтение ключей сервера
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: awg_server_keys_raw
  loop:
    - /opt/amneziawg-tools/keys/server.key
    - /opt/amneziawg-tools/keys/server.pub

- name: Переменные ключей сервера
  ansible.builtin.set_fact:
    server_private_key: "{{ (awg_server_keys_raw.results[0].content | b64decode).strip() }}"
    server_public_key: "{{ (awg_server_keys_raw.results[1].content | b64decode).strip() }}"

- name: Генерация приватных ключей клиентов по кодовым именам (если ещё нет)
  ansible.builtin.shell: "umask 077 && awg genkey > /opt/amneziawg-tools/keys/{{ item }}.key"
  args:
    creates: "/opt/amneziawg-tools/keys/{{ item }}.key"
  loop: "{{ amneziawg_clients }}"

- name: Публичные ключи клиентов
  ansible.builtin.shell: "awg pubkey < /opt/amneziawg-tools/keys/{{ item }}.key > /opt/amneziawg-tools/keys/{{ item }}.pub"
  args:
    creates: "/opt/amneziawg-tools/keys/{{ item }}.pub"
  loop: "{{ amneziawg_clients }}"

- name: Права на приватные ключи клиентов
  ansible.builtin.file:
    path: "/opt/amneziawg-tools/keys/{{ item }}.key"
    mode: '0600'
    owner: root
  loop: "{{ amneziawg_clients }}"

- name: Права на публичные ключи клиентов
  ansible.builtin.file:
    path: "/opt/amneziawg-tools/keys/{{ item }}.pub"
    mode: '0600'
    owner: root
  loop: "{{ amneziawg_clients }}"

- name: Чтение приватных ключей клиентов
  ansible.builtin.slurp:
    src: "/opt/amneziawg-tools/keys/{{ item }}.key"
  register: awg_client_priv_raw
  loop: "{{ amneziawg_clients }}"

- name: Чтение публичных ключей клиентов
  ansible.builtin.slurp:
    src: "/opt/amneziawg-tools/keys/{{ item }}.pub"
  register: awg_client_pub_raw
  loop: "{{ amneziawg_clients }}"

- name: Сборка списка клиентов (имя, ключи, tunnel-адрес)
  ansible.builtin.set_fact:
    awg_clients: "{{ awg_clients | default([]) + [awg_client_entry] }}"
  loop: "{{ amneziawg_clients }}"
  loop_control:
    index_var: idx
  vars:
    awg_client_entry:
      name: "{{ item }}"
      private_key: "{{ (awg_client_priv_raw.results[idx].content | b64decode).strip() }}"
      public_key: "{{ (awg_client_pub_raw.results[idx].content | b64decode).strip() }}"
      address: "{{ amneziawg_server_address.split('.')[0:3] | join('.') }}.{{ idx + 2 }}"

# Обфускация: значения обязаны быть уникальны для каждого деплоя (см. README
# amnezia-vpn/amneziawg-linux-kernel-module) — генерируются один раз и хранятся
# только на VPS, при повторных прогонах перечитываются, а не перегенерируются.
- name: Проверка наличия файла параметров обфускации
  ansible.builtin.stat:
    path: /opt/amneziawg-tools/keys/params.yml
  register: awg_params_file

- name: Генерация параметров обфускации (Jc/S1/S2/H1-H4) при первом запуске
  when: not awg_params_file.stat.exists
  block:
    - name: Случайные значения Jc/S1/S2/H1-H4
      ansible.builtin.set_fact:
        awg_gen_jc: "{{ range(4, 13) | random }}"
        awg_gen_s1: "{{ range(15, 151) | random }}"
        awg_gen_s2_raw: "{{ range(15, 151) | random }}"
        awg_gen_h1: "{{ range(5, 2147483648) | random }}"
        awg_gen_h2: "{{ range(5, 2147483648) | random }}"
        awg_gen_h3: "{{ range(5, 2147483648) | random }}"
        awg_gen_h4: "{{ range(5, 2147483648) | random }}"

    - name: Корректировка S2, если совпал с S1 + 56 (запрещено спекой)
      ansible.builtin.set_fact:
        awg_gen_s2: "{{ (awg_gen_s2_raw | int + 1) if (awg_gen_s1 | int + 56 == awg_gen_s2_raw | int) else awg_gen_s2_raw }}"

    - name: Запись параметров обфускации на диск
      ansible.builtin.copy:
        dest: /opt/amneziawg-tools/keys/params.yml
        owner: root
        mode: '0600'
        content: |
          jc: {{ awg_gen_jc }}
          jmin: 8
          jmax: 80
          s1: {{ awg_gen_s1 }}
          s2: {{ awg_gen_s2 }}
          h1: {{ awg_gen_h1 }}
          h2: {{ awg_gen_h2 }}
          h3: {{ awg_gen_h3 }}
          h4: {{ awg_gen_h4 }}

- name: Чтение параметров обфускации
  ansible.builtin.slurp:
    src: /opt/amneziawg-tools/keys/params.yml
  register: awg_params_raw

- name: Переменная с параметрами обфускации
  ansible.builtin.set_fact:
    awg_params: "{{ awg_params_raw.content | b64decode | from_yaml }}"

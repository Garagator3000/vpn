---
- name: Создание директорий /opt/amneziawg-go
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/amneziawg-go
    - /opt/amneziawg-go/src
    - /opt/amneziawg-go/bin

- name: Клонирование amneziawg-go v{{ amneziawg_go_version }}
  ansible.builtin.git:
    repo: https://github.com/amnezia-vpn/amneziawg-go.git
    dest: /opt/amneziawg-go/src
    version: "v{{ amneziawg_go_version }}"
    force: true
  register: amneziawg_go_checkout

- name: Сборка amneziawg-go (make)
  ansible.builtin.command: make
  args:
    chdir: /opt/amneziawg-go/src
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
  changed_when: amneziawg_go_checkout.changed
  notify: Restart amneziawg-go

- name: Копирование бинарника в /opt/amneziawg-go/bin
  ansible.builtin.copy:
    src: /opt/amneziawg-go/src/amneziawg-go
    dest: /opt/amneziawg-go/bin/amneziawg-go
    mode: '0755'
    remote_src: true

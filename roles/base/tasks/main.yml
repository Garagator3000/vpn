---
- name: Обновление кеша apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Установка необходимых пакетов
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - vim
      - htop
      - tcpdump
      - iproute2
      - dnsutils
      - git
      - make
      - gcc
      - libc6-dev
      - pkg-config
    state: present
